name: Upstream release watch

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issues to the job summary instead of opening them
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/upstream-release-watch.yml"
      - ".github/scripts/upstream_release_watch.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UPSTREAM: BerriAI/litellm
  DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run == true }}
  MODEL_NAME: Gemma 4 E4B

jobs:
  watch:
    name: watch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: write
    outputs:
      versions: ${{ steps.pending.outputs.versions }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Keep the workflows this fork does not use switched off
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[]
              | select(.state == "active" and (.path | startswith(".github/workflows/")))
              | select(.path | IN(".github/workflows/upstream-release-watch.yml", ".github/workflows/publish-image.yml") | not)
              | "\(.id) \(.path)"' |
            while read -r id path; do
              echo "Disabling $path"
              gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable" ||
                echo "::warning::could not disable $path"
            done

      - name: Find upstream releases without an issue
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then extra=(--ignore-existing-issues); else extra=(); fi
          versions=$(python3 .github/scripts/upstream_release_watch.py pending \
            --upstream "$UPSTREAM" --repo "$GITHUB_REPOSITORY" "${extra[@]}")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Releases to report: $versions"

  report:
    name: report v${{ matrix.version }}
    needs: watch
    if: needs.watch.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.watch.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Collect the upstream commit messages
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delimiter="PROMPT_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delimiter"
            python3 .github/scripts/upstream_release_watch.py prompt --upstream "$UPSTREAM" --version "$VERSION"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize the release with Gemma 4 E4B
        id: summary
        continue-on-error: true
        uses: lsetiawan/llama-server-action@422af2ffd5119f8018240a0c4c4aa67aa988a361
        env:
          LLAMA_ARG_CTX_SIZE: "16384"
          LLAMA_ARG_N_PARALLEL: "1"
          LLAMA_ARG_N_PREDICT: "900"
          LLAMA_ARG_TEMPERATURE: "0.2"
          LLAMA_ARG_REASONING: "off"
          LLAMA_ARG_MMPROJ_AUTO: "0"
        with:
          model: ggml-org/gemma-4-E4B-it-GGUF:Q4_0
          cache: false
          instructions: >-
            You write release briefings for the maintainers of a fork of LiteLLM, an LLM gateway. You are given
            the commit messages of an upstream patch release. Use only what the commit messages say and do not
            invent details.


            Write markdown with exactly two sections. '### What changed' has at most 8 bullets that group related
            commits, most important first. '### Security' lists every commit that fixes a vulnerability or hardens
            authentication, authorization, secrets or input handling, with one line on what was exposed. When
            there is none, it says that nothing in these commit messages looks like a security fix.
          prompt: ${{ steps.commits.outputs.prompt }}

      - name: Open the issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.summary.outputs.response }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then extra=(--dry-run); else extra=(); fi
          python3 .github/scripts/upstream_release_watch.py report \
            --upstream "$UPSTREAM" --repo "$GITHUB_REPOSITORY" --version "$VERSION" \
            --model-name "$MODEL_NAME" --summary="$SUMMARY" "${extra[@]}" |
            tee -a "$GITHUB_STEP_SUMMARY"
